name: ci
# Scratch workflow (not part of any PR): renders screenshots of a feature
# branch for its pull request and commits them to the pr-assets branch.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {path: scratch}
      - name: Which branch
        id: cfg
        run: |
          echo "branch=$(cat scratch/scratch_shots/BRANCH)" >> "$GITHUB_OUTPUT"
          echo "branch_a=$(cat scratch/scratch_shots/BRANCH_A)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with: {ref: "${{ steps.cfg.outputs.branch }}", path: src}
      - uses: actions/checkout@v4
        with: {ref: "${{ steps.cfg.outputs.branch_a }}", path: src_a}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 fonts-dejavu-core
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r src/requirements.txt pypdf
      - name: Shots
        env: {QT_QPA_PLATFORM: offscreen}
        run: |
          mkdir -p out
          (cd src && OUT=../out timeout 600 python ../scratch/scratch_shots/shots_b.py) || echo "FAILED b"
          (cd src_a && OUT=../out timeout 600 python ../scratch/scratch_shots/shots_a.py) || echo "FAILED a"
          ls -la out
      - name: Publish
        run: |
          cd out
          git init -q
          git checkout -q -b pr-assets
          git add .
          git -c user.name=shots -c user.email=shots@users.noreply.github.com commit -qm "screenshots for ${{ steps.cfg.outputs.branch }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" pr-assets:pr-assets
